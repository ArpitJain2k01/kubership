services:
  kubership:
    image: itsajsince2ko1/kubership:v1.0.0
    container_name: kubership
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    stop_grace_period: 15s
