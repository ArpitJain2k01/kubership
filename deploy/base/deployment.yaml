apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubership
  labels:
    app.kubernetes.io/name: kubership
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubership
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubership
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubership
          # Registry and tag are set per environment by the overlays' `images:`.
          image: kubership
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
