apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubership-staging
resources:
  - namespace.yaml
  - ../../base
images:
  - name: kubership
    newTag: staging
patches:
  - target:
      kind: Deployment
      name: kubership
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
